version: "3.9"
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flood
      POSTGRES_USER: flood_user
      POSTGRES_PASSWORD: flood_pass
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

  tiles:
    image: kartoza/geoserver:2.24.2
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
    ports: ["8081:8080"]

  api:
    image: ghcr.io/your-org/flood-api:latest
    depends_on: [db, redis, minio, tiles]
    environment:
      DATABASE_URL: postgresql://flood_user:flood_pass@db:5432/flood
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: flood-artifacts
    ports: ["8080:8080"]

volumes:
  db_data:
  minio_data:
