openapi: 3.0.3
info:
  title: Flood Modeling Platform API
  version: 1.0.0
  description: API for HEC-RAS web orchestration and results services.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RunStatus:
      type: string
      enum: [PENDING, VALIDATING, RUNNING, SUCCEEDED, FAILED, CANCELED]
paths:
  /auth/login:
    post:
      summary: Login
      responses:
        '200': { description: OK }
  /projects:
    get:
      summary: List projects
      responses:
        '200': { description: OK }
    post:
      summary: Create project
      responses:
        '201': { description: Created }
  /runs:
    post:
      summary: Submit run
      responses:
        '202': { description: Accepted }
  /runs/{run_id}:
    get:
      summary: Get run status
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
  /runs/{run_id}/logs:
    get:
      summary: Fetch run logs
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
  /runs/{run_id}/complete:
    post:
      summary: Internal worker completion callback
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
